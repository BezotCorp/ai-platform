[package]
name = "bcaip-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "bcaip"
path = "src/main.rs"

[[bin]]
name = "generate_manpages"
path = "src/bin/generate_manpages.rs"

[[bin]]
name = "mcp_conformance_driver"
path = "src/bin/mcp_conformance_driver.rs"

[dependencies]
clap_mangen = { version = "0.3", default-features = false }
goose = { path = "../goose", default-features = false }
agent-client-protocol = { workspace = true, optional = true }
agent-client-protocol-schema = { workspace = true }
goose-mcp = { path = "../goose-mcp", default-features = false, optional = true }
goose-providers = { path = "../goose-providers", default-features = false }
goose-sdk-types = { path = "../goose-sdk-types", default-features = false }
bcaip-agent = { path = "../bcaip-agent", default-features = false }
bcaip-roaming = { path = "../bcaip-roaming", optional = true }
rmcp = { workspace = true }
clap = { workspace = true }
cliclack = { version = "0.5", default-features = false }
console = { version = "0.16", default-features = false, features = ["std"] }
unicode-segmentation = { version = "1.13", default-features = false }
dotenvy = { workspace = true }
bat = { version = "0.26", default-features = false, features = ["regex-onig"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
yaml_serde = { workspace = true }
strum = { workspace = true }
strsim = "0.11"
tempfile = { workspace = true }
etcetera = { workspace = true }
rand = { workspace = true }
rustyline = { version = "18", default-features = false, features = [
    "custom-bindings",
    "with-dirs",
    "with-file-history",
] }
tracing = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
shlex = { version = "2.0", default-features = false, features = ["std"] }
async-trait = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
tar = { version = "0.4.46", default-features = false }
reqwest = { workspace = true, features = ["blocking"] }
zip = { workspace = true }
bzip2 = { version = "0.6", default-features = false, features = ["default"] }
webbrowser = { workspace = true }
indicatif = { version = "0.18", default-features = false }
tokio-util = { workspace = true, features = ["compat", "rt"] }
anstream = { version = "1", default-features = false, features = ["auto"] }
open = { version = "5", default-features = false }
url = { workspace = true }
urlencoding = { workspace = true }
clap_complete = { version = "4", default-features = false }
comfy-table = { version = "8", default-features = false }
sha2 = { workspace = true }
sigstore-verify = { version = "0.14", default-features = false, optional = true }
snap = { workspace = true, optional = true }
axum.workspace = true
axum-server = { workspace = true, optional = true }
clap_complete_nushell = { version = "4", default-features = false }
qrcode = { version = "0.14.1", optional = true }
fs2 = { workspace = true, optional = true }
bcaip-download-manager = { path = "../bcaip-download-manager", optional = true }
goose-local-inference = { path = "../goose-local-inference", default-features = false, optional = true }
goose-provider-types = { path = "../goose-provider-types", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
anstream = { version = "1", default-features = false, features = ["wincon"] }
ntapi = { version = "0.4.3", default-features = false, features = ["user"] }
winapi = { workspace = true, features = [
    "consoleapi",
    "processenv",
    "winbase",
    "wincon",
] }

[target."cfg(unix)".dependencies]
libc = { version = "0.2.190", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", features = ["fs", "process", "termios", "event"] }

[features]
default = [
    "code-mode",
    "tree-sitter",
    "local-inference",
    "aws-providers",
    "telemetry",
    "otel",
    "rustls-tls",
    "live-voice",
    "system-keyring",
    "update",
    "bundled-mcp",
    "scheduler",
    "platform-apps",
    "chat-recall",
    "acp-http",
    "online-model-meta",
]
online-model-meta = ["goose/online-model-meta"]
roaming = [
    "dep:bcaip-roaming",
    "dep:qrcode",
    "dep:fs2",
    "dep:agent-client-protocol",
]
code-mode = ["goose/code-mode"]
tree-sitter = ["goose/tree-sitter"]
live-voice = ["goose/live-voice"]
local-inference = [
    "goose/local-inference",
    "dep:bcaip-download-manager",
    "dep:goose-local-inference",
]
aws-providers = ["goose/aws-providers"]
cuda = ["goose/cuda", "local-inference"]
vulkan = ["goose/vulkan", "local-inference"]
mlx = ["goose/mlx", "local-inference"]
telemetry = ["goose/telemetry"]
otel = ["goose/otel"]
system-keyring = ["goose/system-keyring"]
update = ["dep:sigstore-verify", "dep:snap"]
bundled-mcp = ["dep:goose-mcp", "goose-mcp/bundled-mcp"]
scheduler = ["goose/scheduler"]
platform-apps = ["goose/platform-apps"]
chat-recall = ["goose/chat-recall"]
acp-http = ["goose/acp-http"]
portable-default = [
    "rustls-tls",
    "tree-sitter",
    "live-voice",
    "aws-providers",
    "telemetry",
    "otel",
    "bundled-mcp",
    "scheduler",
    "platform-apps",
    "chat-recall",
    "acp-http",
]
# disables the update command
disable-update = []
rustls-tls = [
    "dep:axum-server",
    "reqwest/rustls",
    "axum-server/tls-rustls",
    "sigstore-verify?/rustls",
    "goose/rustls-tls",
    "goose-mcp?/rustls-tls",
    "goose-providers/rustls-tls",
]
native-tls = [
    "dep:axum-server",
    "reqwest/native-tls",
    "axum-server/tls-openssl",
    "sigstore-verify?/native-tls",
    "goose/native-tls",
    "goose-mcp?/native-tls",
    "goose-providers/native-tls",
]
[dev-dependencies]
env-lock.workspace = true
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    # Used only in windows
    "winapi",
]
