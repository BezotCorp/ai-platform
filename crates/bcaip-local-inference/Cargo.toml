[package]
name = "bcaip-local-inference"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
mlx = ["dep:safemlx", "dep:safemlx-lm", "dep:safemlx-lm-utils"]
hf-hub = [
    "dep:futures",
    "dep:bcaip-download-manager",
    "dep:bcaip-sdk-types",
    "dep:hf-hub",
]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
etcetera = { workspace = true }
encoding_rs = { version = "0.8.42", default-features = false }
futures = { workspace = true, optional = true }
bcaip-download-manager = { path = "../bcaip-download-manager", optional = true }
bcaip-provider-types = { path = "../bcaip-provider-types", default-features = false }
bcaip-sdk-types = { path = "../bcaip-sdk-types", default-features = false, optional = true }
hf-hub = { version = "1.0.0", default-features = false, optional = true }
include_dir = { workspace = true }
llama-cpp-2 = { workspace = true }
llama-cpp-sys-2 = { workspace = true }
minijinja = { workspace = true, features = [
    "builtins",
    "macros",
    "adjacent_loop_items",
    "loop_controls",
] }
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "std"] }
minijinja-contrib = { version = "2.24.0", features = [
    "pycompat",
], default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["sampler", "metal", "mtmd"] }
safemlx = { default-features = false, features = [
    "accelerate",
    "metal",
    "safetensors",
], optional = true, version = "0.3.1" }
safemlx-lm = { optional = true, version = "0.4.1" }
safemlx-lm-utils = { optional = true, version = "0.1.4" }

[dev-dependencies]
env-lock.workspace = true
