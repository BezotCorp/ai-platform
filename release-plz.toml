[workspace]
release = false
pr_name = "chore(GDK): release{% if version %} v{{ version }}{% endif %}"
git_tag_enable = false
git_tag_name = "gdk-v{{ version }}"
git_release_enable = false

[[package]]
name = "bcaip-provider-types"
release = true
version_group = "gdk"

[[package]]
name = "bcaip-sdk-types"
release = true
version_group = "gdk"

[[package]]
name = "bcaip-download-manager"
release = true
version_group = "gdk"

[[package]]
name = "bcaip-local-inference"
release = true
version_group = "gdk"
# cargo-semver-checks builds with --all-features, which turns on cuda/vulkan and
# requires a CUDA Toolkit the release runner doesn't have.
semver_check = false

[[package]]
name = "bcaip-providers"
release = true
version_group = "gdk"
# Same as bcaip-local-inference: --all-features pulls in the cuda/vulkan
# accelerator features through the optional local-inference dependency.
semver_check = false

[[package]]
name = "bcaip-agent"
release = true
version_group = "gdk"

[[package]]
name = "bcaip-context-management"
release = true
version_group = "gdk"

[[package]]
name = "bcaip-sdk"
release = true
version_group = "gdk"
