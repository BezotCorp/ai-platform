# The ACP endpoint binds 0.0.0.0, so it requires a secret key; a random one is
# generated and printed per launch unless BCAIP_SERVER__SECRET_KEY is set.
run:
  - name: ACP Server
    command: 'export BCAIP_SERVER__SECRET_KEY="${BCAIP_SERVER__SECRET_KEY:-$(openssl rand -hex 32)}"; echo "ACP secret key: $BCAIP_SERVER__SECRET_KEY"; exec bcaip serve --platform desktop --host 0.0.0.0 --port 3284'
    port: 3284
