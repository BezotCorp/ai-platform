    "std",
    "std-future",
] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
] }
urlencoding = { version = "2.1", default-features = false }
uuid = { version = "1.27", default-features = false, features = ["v4", "std"] }
