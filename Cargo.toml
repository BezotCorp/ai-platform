[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98.1"
authors = ["BezotCorp <contact@bezotcorp.com>"]
license = "Apache-2.0"
repository = "https://github.com/BezotCorp/ai-platform"
description = "An AI agent"

[workspace.lints.clippy]
uninlined_format_args = "allow"
string_slice = "warn"

[workspace.dependencies]
rmcp = { version = "3", default-features = false, features = ["schemars"] }
agent-client-protocol-schema = { version = "=1.9.1", default-features = false }
agent-client-protocol = { version = "2", default-features = false }
agent-client-protocol-http = { version = "2", default-features = false }
arboard = { version = "3.6.1", default-features = false }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
async-stream = { version = "0.3.6", default-features = false }
async-trait = { version = "0.1.92", default-features = false }
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "http2",
    "json",
    "tokio",
    "query",
] }
axum-server = { version = "0.8.0", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = [
    "serde",
    "std",
] }
clap = { version = "4.6.7", default-features = false, features = [
    "derive",
    "std",
    "help",
    "suggestions",
    "usage",
    "color",
    "error-context",
] }
dirs = { version = "7.0.0", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
env-lock = { version = "1.0.2", default-features = false }
etcetera = { version = "0.11.0", default-features = false }
fs2 = { version = "0.4.3", default-features = false }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
ignore = { version = "0.4.33", default-features = false }
include_dir = { version = "0.7.4", default-features = false }
indoc = { version = "2.0.7", default-features = false }
iroh = { version = "1.3.0", default-features = false }
iroh-relay = { version = "1.3.0", default-features = false }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
lru = { version = "0.18.5", default-features = false }
once_cell = { version = "1.21.4", default-features = false, features = ["std"] }
rand = "0.10.3"
regex = { version = "1.13.1", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "multipart",
    "form",
] }
rustls = { version = "0.23.45", default-features = false, features = [
    "aws_lc_rs",
    "std",
] }
minijinja = { version = "2.24.0", default-features = false, features = [
    "loader",
    "multi_template",
    "serde",
] }
schemars = { version = "1.2.2", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = [
