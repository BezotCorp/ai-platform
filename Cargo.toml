which = { version = "8", default-features = false, features = ["real-sys"] }
winapi = { version = "0.3.9", default-features = false, features = [
    "wincred",
    "std",
] }
wiremock = { version = "0.6", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
serial_test = { version = "4", default-features = false }
sha2 = { version = "0.11", default-features = false }
shell-words = { version = "1", default-features = false, features = ["std"] }
snap = { version = "1", default-features = false }
test-case = { version = "3", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = [
    "metrics",
] }
opentelemetry-http = { version = "0.33.0", default-features = false, features = [
    "internal-logs",
    "reqwest",
] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
    "http-proto",
    "internal-logs",
    "logs",
    "metrics",
    "reqwest-client",
    "trace",
] }
opentelemetry-appender-tracing = { version = "0.33.0", default-features = false, features = [
    "experimental_span_attributes",
] }
opentelemetry-stdout = { version = "0.33.0", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
] }
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = [
    "metrics",
