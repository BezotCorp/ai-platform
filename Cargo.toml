rayon = { version = "1.12.0", default-features = false }
tree-sitter = { version = "0.27.0", default-features = false, features = [
    "std",
] }
tree-sitter-go = { version = "0.25.0", default-features = false }
tree-sitter-java = { version = "0.23.5", default-features = false }
tree-sitter-javascript = { version = "0.25.0", default-features = false }
tree-sitter-kotlin-ng = { version = "1.1.0", default-features = false }
tree-sitter-python = { version = "0.25.0", default-features = false }
tree-sitter-ruby = { version = "0.23.1", default-features = false }
tree-sitter-rust = { version = "0.24.2", default-features = false }
tree-sitter-swift = { version = "0.7.4", default-features = false }
tree-sitter-typescript = { version = "0.23.2", default-features = false }

# llama-cpp-2 doesn't pin the version of its sys crate, so we do it here. it also has breaking changes in patch releases, so we use an exact version pin
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = [
    "sampler",
    "mtmd",
] }
llama-cpp-sys-2 = { version = "=0.1.158", default-features = false }

[patch.crates-io]
cudaforge = { git = "https://github.com/jbg/cudaforge", rev = "e7c1967340e40673db98dc9e17da0f04834a456f" }

# Dependencies don't need debug info. You rarely step-debug into third-party
# crates, but their DWARF dominates `target/debug` — roughly 50-70% of each
# dependency rlib in this workspace is debug info. Dropping it for dependencies
# only shrinks the debug build substantially and speeds linking. The "*" spec
# matches all dependencies but NOT workspace members, so first-party crates keep
# full debug info and stay fully debuggable; release builds are unaffected.
[profile.dev.package."*"]
debug = false

[profile.lean]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
